services:
  db:
    image: postgres:16
    container_name: clinicashare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicashare
      POSTGRES_PASSWORD: clinicashare
      POSTGRES_DB: clinicashare
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicashare -d clinicashare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
